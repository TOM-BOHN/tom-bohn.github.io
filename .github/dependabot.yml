# Dependabot configuration for npm dependencies.
# Grouped weekly updates keep noise low. Tailwind CSS major bumps are ignored
# because v4 is a breaking migration (see #79 / accidental re-bump via #81).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: sandbox
    labels:
      - dependencies
      - javascript
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        exclude-patterns:
          - "tailwindcss"
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      # 5.6+ dropped several Simple Icons brand exports (SiTableau, SiSalesforce,
      # SiSlack, SiOpenai, SiAmazon, SiDbt, …) used by Links/Hub. Stay on 5.5.0
      # until those call sites migrate to Fa/Fa6 fallbacks.
      - dependency-name: react-icons
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: sandbox
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
