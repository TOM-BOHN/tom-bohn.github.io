# Dependabot configuration.
# Policy: prefer opening update PRs so they can be reviewed and built. Only
# ignore a package when a prior update caused a proven break AND an open
# tracking issue exists with acceptance criteria to remove the ignore.
# Workflow: .cursor/skills/dependabot-upgrade/SKILL.md
#
# npm: weekly grouped updates on sandbox. github-actions: monthly grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: sandbox
    labels:
      - dependencies
      - javascript
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        # Keep migration-sensitive packages out of the catch-all group so their
        # PRs are reviewable alone. Exclusion ≠ ignore — updates still open.
        exclude-patterns:
          - "tailwindcss"
          - "typescript"
          - "@types/node"
    ignore:
      # tracking: #109 — TS 7 hard-crashes eslint (typescript-eslint unsupported).
      # On ~6.0.x for now. Remove when the TS 7 migration PR Fixes #109.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: sandbox
    # Use the existing `dependencies` label only — `github-actions` is not
    # defined in this repo (Dependabot errored on missing labels in #85–#89).
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: scope
