# Dependabot configuration.
# Policy: prefer opening update PRs so they can be reviewed and built. Only
# ignore a package when a prior update caused a proven break (or API removal)
# that is not yet migrated. Document each ignore in AGENTS.md + SECURITY.md.
#
# npm: weekly grouped updates on sandbox. github-actions: monthly grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: sandbox
    labels:
      - dependencies
      - javascript
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        # Keep migration-blocked or major-sensitive packages out of the catch-all
        # group so their PRs are reviewable on their own (not bundled with
        # unrelated patch/minor bumps). They are still updated — just not ignored.
        exclude-patterns:
          - "tailwindcss"
          - "react-icons"
          - "typescript"
          - "@types/node"
    ignore:
      # Proven break: Dependabot #77 major-bumped Tailwind 3→4; PostCSS plugin
      # API moved and `npm run build` failed. Restored in #79. Stay on v3 until
      # an intentional v4 migration (config + `@tailwind` CSS).
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      # Proven break: 5.6+ removed Simple Icons brand exports still imported by
      # Links/Hub (`SiTableau`, `SiSalesforce`, `SiSlack`, `SiOpenai`, `SiAmazon`,
      # `SiDbt`, …). Exact pin 5.5.0 in package.json. Ignore majors only so any
      # future 5.5.x security patch can still open a PR; unblock by migrating
      # those call sites to Fa/Fa6 (or equivalent).
      - dependency-name: react-icons
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: sandbox
    # Use the existing `dependencies` label only — `github-actions` is not
    # defined in this repo (Dependabot errored on missing labels in #85–#89).
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: scope
